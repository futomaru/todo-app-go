openapi: 3.0.3

info:
  title: Todo App API
  version: 0.1.0
  description: |
    REST API specification for a todo app built for learning purposes (MVP).
  contact:
    name: futomaru
  license:
    name: Unlicensed (for learning purposes)

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: todos
    description: CRUD operations on the Todo resource

paths:
  /api/v1/todos:
    get:
      tags: [todos]
      operationId: listTodos
      summary: List todos
      description: |
        Retrieves all todos. The `completed` query parameter can filter by completion status.
        Results are ordered by `id` ascending (insertion order).
      parameters:
        - name: completed
          in: query
          required: false
          description: |
            Filter by completion status. If omitted, returns all todos.
            - `true`: completed only
            - `false`: incomplete only
          schema:
            type: boolean
      responses:
        '200':
          description: Success (returns an empty array if there are no results)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoResponse'
              examples:
                two-items:
                  summary: Example with 2 items
                  value:
                    - id: 1
                      title: Buy groceries
                      description: Milk and bread
                      completed: false
                      createdAt: '2026-06-02T10:00:00Z'
                      updatedAt: '2026-06-02T10:00:00Z'
                    - id: 2
                      title: Clean the room
                      description: null
                      completed: true
                      createdAt: '2026-06-01T08:30:00Z'
                      updatedAt: '2026-06-02T09:15:00Z'
                empty:
                  summary: Example with 0 items
                  value: []
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [todos]
      operationId: createTodo
      summary: Create a todo
      description: |
        Creates a new todo. `completed` always starts as `false` on the server side and is not accepted from the request.
        `createdAt` and `updatedAt` are both set to the same server-side current time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreateRequest'
            examples:
              with-description:
                summary: Title and description specified
                value:
                  title: Buy groceries
                  description: Milk and bread
              title-only:
                summary: Title only (description omitted)
                value:
                  title: Buy groceries
      responses:
        '201':
          description: Created successfully
          headers:
            Location:
              description: URI of the created resource
              schema:
                type: string
                example: /api/v1/todos/2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
              example:
                id: 2
                title: Buy groceries
                description: Milk and bread
                completed: false
                createdAt: '2026-06-02T10:00:00Z'
                updatedAt: '2026-06-02T10:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [todos]
      operationId: deleteCompletedTodos
      summary: Bulk delete completed todos
      description: |
        Deletes all todos where `completed = true` (equivalent to TodoMVC's "Clear completed").

        **Notes:**
        - Returns `204` even when zero todos match (for collection deletes, operating on an empty set still counts as success).
        - This differs in semantics from a single `DELETE /api/v1/todos/{id}`, which returns `404`.
        - `?completed=false` (bulk-deleting incomplete todos) is intentionally unsupported due to the high risk of accidental data loss.
      parameters:
        - name: completed
          in: query
          required: true
          description: Filter for which todos to delete. This MVP accepts only `true`.
          schema:
            type: boolean
            enum: [true]
      responses:
        '204':
          description: Deleted successfully (204 even when zero todos match)
        '400':
          description: |
            Returned when `completed` is missing or set to a value other than `true`.
            See the examples below for how the error differs between a missing parameter and an invalid value.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                missing:
                  summary: completed query parameter missing
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: "Required parameter 'completed' is not present"
                    instance: /api/v1/todos
                invalid:
                  summary: completed=false or any value other than true
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Validation failed
                    instance: /api/v1/todos
                    errors:
                      - field: completed
                        message: must be true
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/todos/{id}:
    parameters:
      - $ref: '#/components/parameters/TodoIdParam'

    get:
      tags: [todos]
      operationId: getTodoById
      summary: Get a single todo
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
              example:
                id: 1
                title: Buy groceries
                description: Milk and bread
                completed: false
                createdAt: '2026-06-02T10:00:00Z'
                updatedAt: '2026-06-02T10:00:00Z'
        '400':
          $ref: '#/components/responses/InvalidPathId'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [todos]
      operationId: updateTodo
      summary: Partially update a todo
      description: |
        PATCH semantics: only the fields included in the request are updated.
        - Fields that are absent from the request, or explicitly `null`, are **not updated**.
        - `completed` distinguishes between "unspecified (null)" and "explicitly set to false".
        - `updatedAt` is updated to the server-side current time.
        - `title` does not allow an empty string. `null` means "unspecified".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdateRequest'
            examples:
              toggle-complete:
                summary: Toggle only the completed flag
                value:
                  completed: true
              update-title:
                summary: Update only the title
                value:
                  title: Buy groceries (updated)
              update-multiple:
                summary: Update multiple fields
                value:
                  title: Buy groceries (updated)
                  completed: true
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
              example:
                id: 1
                title: Buy groceries (updated)
                description: Milk and bread
                completed: true
                createdAt: '2026-06-02T10:00:00Z'
                updatedAt: '2026-06-02T11:30:00Z'
        '400':
          description: |
            Request body validation failed (e.g. length or empty-string constraint violations),
            or `id` is less than 1.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [todos]
      operationId: deleteTodoById
      summary: Delete a single todo
      description: |
        Deletes the todo with the given `id`. Returns `404` if it does not exist
        (a design choice that prioritizes the "existence check → error → 404" flow over idempotency).
      responses:
        '204':
          description: Deleted successfully (no body)
        '400':
          $ref: '#/components/responses/InvalidPathId'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  parameters:
    TodoIdParam:
      name: id
      in: path
      required: true
      description: Primary key of the todo
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

  schemas:

    TodoResponse:
      type: object
      description: |
        Response representation of a todo, used at the server → client API boundary.
      required:
        - id
        - title
        - completed
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: Primary key (assigned by the server)
          example: 1
        title:
          type: string
          maxLength: 255
          description: Task name (required)
          example: Buy groceries
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Detailed description (optional)
          example: Milk and bread
        completed:
          type: boolean
          description: Completion flag
          example: false
        createdAt:
          type: string
          format: date-time
          description: |
            Creation timestamp. Set to the server-side current time.
            Represented as RFC 3339 with a timezone offset (UTC, `Z`-terminated).
          example: '2026-06-02T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Update timestamp. Equal to createdAt at creation time.
          example: '2026-06-02T10:00:00Z'

    TodoCreateRequest:
      type: object
      description: |
        Todo creation request (POST request body).
        `completed`, `createdAt`, `updatedAt`, and `id` are determined server-side and not accepted in the request.
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Task name. Empty strings, whitespace-only strings, and `null` are all rejected with 400 (max 255 characters).
          example: Buy groceries
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: |
            Detailed description. Max 1000 characters. Both omission and `null` are allowed (optional field).
          example: Milk and bread

    TodoUpdateRequest:
      type: object
      description: |
        Todo partial update request (PATCH request body).
        All fields are optional. Fields that are `null` or omitted are not updated.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: |
            Task name (1-255 characters).
            `null` means "unspecified = not updated".
            An explicit empty string `""` is rejected with 400 (since `null` and an empty string must be distinguished,
            PATCH does not use a rule that unconditionally rejects empty strings).
          example: Buy groceries (updated)
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: |
            Detailed description (max 1000 characters).
            `null` is interpreted as "unspecified = not updated"
            (explicitly clearing the field to NULL is not supported in this MVP).
          example: Milk and eggs
        completed:
          type: boolean
          nullable: true
          description: |
            Completion flag.
            Distinguishes between `null` (unspecified = not updated) and `false` (explicitly reset to incomplete).
          example: true

    ProblemDetail:
      type: object
      description: |
        Error response conforming to RFC 7807 `application/problem+json`.
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          description: URI that uniquely identifies the problem type. Use `about:blank` when there is no more specific classification.
          example: about:blank
        title:
          type: string
          description: Short, human-readable title of the problem (equivalent to the default wording for the HTTP status)
          example: Not Found
        status:
          type: integer
          description: HTTP status code
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: 'Todo not found: 1'
        instance:
          type: string
          format: uri-reference
          description: The specific request path where the problem occurred
          example: /api/v1/todos/1

    ValidationProblemDetail:
      description: |
        ProblemDetail extension used on validation failure (400 Bad Request).
        Adds an `errors` field containing per-field validation error details.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              description: List of per-field validation errors
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                    description: Name of the field the error applies to
                    example: title
                  message:
                    type: string
                    description: Human-readable message describing the validation error
                    example: must not be blank

  responses:

    NotFound:
      description: The resource with the specified ID does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: 'Todo not found: 1'
            instance: /api/v1/todos/1

    InvalidPathId:
      description: |
        Returned when the path variable `{id}` is less than 1, or cannot be parsed as an integer.
        Short-circuited at the handler entry point, before service / repository are called.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Validation failed
            instance: /api/v1/todos/0
            errors:
              - field: id
                message: must be greater than or equal to 1

    ValidationFailed:
      description: |
        Request body validation failed (e.g. missing required fields, length constraint violations).
        The `errors` array contains per-field details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Validation failed
            instance: /api/v1/todos
            errors:
              - field: title
                message: must not be blank
              - field: description
                message: size must be between 0 and 1000

    InternalServerError:
      description: |
        Internal server error (e.g. DB failure, unexpected exception).
        Internal error details are not included in the response (they are logged only); `detail` returns a generic message.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred
            instance: /api/v1/todos
